<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Nationfall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #222;
            padding: 10px 8px;
            border-bottom: 2px solid #444;
            flex-shrink: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            color: #4da6ff;
            margin-bottom: 6px;
        }

        .mode-selector {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            font-weight: bold;
        }

        .mode-btn.active {
            background: #4da6ff;
            color: #000;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .sidebar {
            background: #222;
            border-right: 2px solid #444;
            padding: 8px;
            overflow-y: auto;
            flex-shrink: 0;
            max-height: 100%;
            width: 100%;
        }

        .sidebar.hidden {
            display: none;
        }

        #gameCanvas {
            flex: 1;
            display: block;
            background: #111;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .info-footer {
            background: #222;
            border-top: 1px solid #444;
            padding: 6px;
            font-size: 10px;
            color: #4da6ff;
            flex-shrink: 0;
        }

        .panel-section {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .panel-section h3 {
            font-size: 11px;
            margin-bottom: 6px;
            color: #4da6ff;
            font-weight: bold;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 6px;
            margin: 3px 0;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            font-size: 10px;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin: 3px 0;
            background: #444;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            font-size: 10px;
            border-radius: 3px;
            font-weight: bold;
        }

        button:active {
            background: #4da6ff;
            color: #000;
        }

        .tool-btn {
            display: inline-block;
            width: calc(50% - 2px);
            padding: 6px;
            margin: 2px;
            font-size: 9px;
        }

        /* iPhone Portrait - Stack vertically */
        @media (max-height: 900px) and (max-width: 500px) {
            .main-wrapper {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 35vh;
                border-right: none;
                border-bottom: 2px solid #444;
            }

            #gameCanvas {
                width: 100%;
                flex: 1;
            }

            .info-footer {
                display: none;
            }
        }

        /* Landscape or larger screens */
        @media (min-width: 768px) {
            .sidebar {
                width: 280px;
                max-height: 100%;
            }

            .main-wrapper {
                flex-direction: row;
            }
        }

        /* Scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nationfall</h1>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="map">Map Editor</button>
            <button class="mode-btn" data-mode="gameplay">Gameplay</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="sidebar" id="sidebar">
            <div id="mapEditorPanel">
                <div class="panel-section">
                    <h3>Map Modes</h3>
                    <select id="mapMode">
                        <option value="terrain">Terrain</option>
                        <option value="political">Political</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h3>Drawing</h3>
                    <button class="tool-btn" data-terrain="grass">Grass</button>
                    <button class="tool-btn" data-terrain="water">Water</button>
                    <button class="tool-btn" data-terrain="mountain">Mountain</button>
                    <button class="tool-btn" data-terrain="forest">Forest</button>
                </div>

                <div class="panel-section">
                    <h3>Cities</h3>
                    <button class="tool-btn" data-city="small">Small</button>
                    <button class="tool-btn" data-city="medium">Medium</button>
                    <button class="tool-btn" data-city="large">Large</button>
                    <button class="tool-btn" data-city="capital">★</button>
                </div>

                <div class="panel-section">
                    <h3>Countries</h3>
                    <input type="text" id="countryName" placeholder="Name">
                    <button id="createCountryBtn">Create</button>
                    <button id="drawBorderBtn">Draw Border</button>
                </div>
            </div>

            <div id="gameplayPanel" style="display:none;">
                <div class="panel-section">
                    <h3>Country: <span id="countryNameDisplay">-</span></h3>
                    <div id="countryInfo" style="font-size:9px;"></div>
                </div>

                <div class="panel-section">
                    <h3>War</h3>
                    <button id="declareWarBtn">Declare War</button>
                    <button id="makePeaceBtn">Make Peace</button>
                </div>

                <div class="panel-section">
                    <h3>Army</h3>
                    <select id="armyType">
                        <option value="infantry">Infantry</option>
                        <option value="tank">Tank</option>
                        <option value="navy">Navy</option>
                        <option value="air">Air</option>
                    </select>
                    <input type="number" id="armyNumber" value="5000" min="1000">
                    <button id="spawnArmyBtn">Spawn</button>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="info-footer">
        <div id="mouseInfo">Pos: --</div>
        <div id="tileInfo">Tile: --</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sidebar = document.getElementById('sidebar');

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const TILE_SIZE = 20;
        let ROWS = Math.floor(canvas.height / TILE_SIZE);
        let COLS = Math.floor(canvas.width / TILE_SIZE);

        let gameState = {
            tiles: [],
            cities: [],
            countries: [],
            armies: [],
            wars: [],
            mapMode: 'terrain',
            currentTool: 'grass',
            selectedCountry: null,
            currentMode: 'map'
        };

        class Tile {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.terrain = 'grass';
                this.owner = null;
            }
            getColor() {
                if (gameState.mapMode === 'political') {
                    return this.owner ? this.owner.color : '#2d5016';
                }
                const colors = { grass: '#2d5016', water: '#1e90ff', mountain: '#696969', forest: '#1b4d2e' };
                return colors[this.terrain] || '#2d5016';
            }
        }

        class City {
            constructor(x, y, type, country) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.country = country;
            }
            draw(ctx) {
                const sx = this.x * TILE_SIZE + TILE_SIZE / 2;
                const sy = this.y * TILE_SIZE + TILE_SIZE / 2;
                ctx.fillStyle = '#ffff00';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                if (this.type === 'capital') {
                    ctx.beginPath();
                    ctx.arc(sx, sy, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    const radii = { large: 5, medium: 4, small: 3 };
                    ctx.beginPath();
                    ctx.arc(sx, sy, radii[this.type] || 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }

        class Country {
            constructor(name, color) {
                this.name = name;
                this.color = color;
                this.cities = [];
                this.armies = [];
                this.enemies = [];
            }
        }

        class Army {
            constructor(x, y, type, country, number) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.country = country;
                this.number = number;
            }
            draw(ctx) {
                const sx = this.x * TILE_SIZE + TILE_SIZE / 2;
                const sy = this.y * TILE_SIZE + TILE_SIZE / 2;
                ctx.fillStyle = this.country.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                const radii = { tank: 8, infantry: 6, navy: 5, air: 4 };
                ctx.beginPath();
                ctx.arc(sx, sy, radii[this.type] || 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = '7px Arial';
                ctx.textAlign = 'center';
                ctx.fillText((this.number / 1000).toFixed(0) + 'k', sx, sy);
            }
        }

        function initGame() {
            gameState.tiles = [];
            for (let y = 0; y < ROWS; y++) {
                gameState.tiles[y] = [];
                for (let x = 0; x < COLS; x++) {
                    gameState.tiles[y][x] = new Tile(x, y);
                }
            }

            const c1 = new Country('Red Kingdom', '#ff4444');
            const c2 = new Country('Blue Empire', '#4444ff');
            gameState.countries.push(c1, c2);

            const x1 = Math.floor(COLS * 0.2);
            const y1 = Math.floor(ROWS * 0.5);
            const x2 = Math.floor(COLS * 0.8);
            const y2 = Math.floor(ROWS * 0.5);

            gameState.cities.push(new City(x1, y1, 'capital', c1));
            gameState.cities.push(new City(x2, y2, 'capital', c2));

            gameState.selectedCountry = c1;
        }

        // Mode switcher
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameState.currentMode = e.target.dataset.mode;

                const mapPanel = document.getElementById('mapEditorPanel');
                const gamePanel = document.getElementById('gameplayPanel');
                if (gameState.currentMode === 'map') {
                    mapPanel.style.display = 'block';
                    gamePanel.style.display = 'none';
                } else {
                    mapPanel.style.display = 'none';
                    gamePanel.style.display = 'block';
                }
            });
        });

        // Terrain tools
        document.querySelectorAll('[data-terrain]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                gameState.currentTool = e.target.dataset.terrain;
            });
        });

        // City tools
        document.querySelectorAll('[data-city]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                gameState.currentTool = 'city:' + e.target.dataset.city;
            });
        });

        // Create country
        document.getElementById('createCountryBtn').addEventListener('click', () => {
            const name = document.getElementById('countryName').value || 'Country ' + (gameState.countries.length + 1);
            const color = 'hsl(' + Math.random() * 360 + ', 70%, 50%)';
            gameState.countries.push(new Country(name, color));
            gameState.selectedCountry = gameState.countries[gameState.countries.length - 1];
            document.getElementById('countryName').value = '';
        });

        // Border drawing
        document.getElementById('drawBorderBtn').addEventListener('click', () => {
            gameState.currentTool = 'border';
        });

        // Map mode
        document.getElementById('mapMode').addEventListener('change', (e) => {
            gameState.mapMode = e.target.value;
        });

        // Spawn army
        document.getElementById('spawnArmyBtn').addEventListener('click', () => {
            if (gameState.selectedCountry && gameState.selectedCountry.cities.length > 0) {
                const city = gameState.selectedCountry.cities[0];
                const type = document.getElementById('armyType').value;
                const number = parseInt(document.getElementById('armyNumber').value);
                gameState.armies.push(new Army(city.x, city.y, type, gameState.selectedCountry, number));
                alert('Army spawned!');
            }
        });

        // Declare war
        document.getElementById('declareWarBtn').addEventListener('click', () => {
            const enemies = gameState.countries.filter(c => c !== gameState.selectedCountry);
            if (enemies.length > 0) {
                gameState.selectedCountry.enemies.push(enemies[0]);
                gameState.wars.push({ a: gameState.selectedCountry, b: enemies[0] });
                alert('War declared on ' + enemies[0].name);
            }
        });

        // Canvas events
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((touch.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((touch.clientY - rect.top) / TILE_SIZE);

            if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;

            if (gameState.currentMode === 'map') {
                if (gameState.currentTool.startsWith('city:')) {
                    const type = gameState.currentTool.split(':')[1];
                    gameState.cities.push(new City(x, y, type, gameState.selectedCountry));
                } else if (gameState.currentTool === 'border' && gameState.selectedCountry) {
                    gameState.tiles[y][x].owner = gameState.selectedCountry;
                } else {
                    gameState.tiles[y][x].terrain = gameState.currentTool;
                }
            } else {
                if (gameState.tiles[y][x].owner) {
                    gameState.selectedCountry = gameState.tiles[y][x].owner;
                    document.getElementById('countryNameDisplay').textContent = gameState.selectedCountry.name;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            document.getElementById('mouseInfo').textContent = 'Pos: ' + x + ',' + y;
        });

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    ctx.fillStyle = gameState.tiles[y][x].getColor();
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }

            gameState.cities.forEach(c => c.draw(ctx));
            gameState.armies.forEach(a => a.draw(ctx));

            requestAnimationFrame(draw);
        }

        initGame();
        draw();
    </script>
</body>
</html>
