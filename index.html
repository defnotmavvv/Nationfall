<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nationfall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #222;
            padding: 10px;
            border-bottom: 2px solid #444;
            flex-shrink: 0;
            max-height: 60px;
            overflow-y: auto;
        }

        .header h1 {
            font-size: 18px;
            color: #4da6ff;
            margin-bottom: 8px;
        }

        .mode-selector {
            display: flex;
            gap: 5px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
        }

        .mode-btn.active {
            background: #4da6ff;
            color: #000;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
        }

        .sidebar {
            width: 100%;
            max-width: 280px;
            background: #222;
            border-right: 2px solid #444;
            overflow-y: auto;
            padding: 10px;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #gameCanvas {
            flex: 1;
            display: block;
            background: #111;
            width: 100%;
            height: 100%;
        }

        .info-panel {
            background: #222;
            border-top: 1px solid #444;
            padding: 8px;
            font-size: 11px;
            color: #4da6ff;
            flex-shrink: 0;
        }

        .panel-section {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .panel-section h3 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #4da6ff;
        }

        select, input {
            width: 100%;
            padding: 6px;
            margin: 4px 0;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            font-size: 11px;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: #444;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
        }

        button:active {
            background: #4da6ff;
            color: #000;
        }

        .tool-btn {
            display: inline-block;
            width: calc(50% - 2px);
            padding: 6px;
            margin: 2px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #222;
            border: 2px solid #4da6ff;
            padding: 20px;
            border-radius: 8px;
            max-width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                max-width: 100%;
                max-height: 30vh;
                width: 100%;
            }

            .content {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nationfall</h1>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="map">Map Editor</button>
            <button class="mode-btn" data-mode="gameplay">Gameplay</button>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div id="mapEditorPanel" class="panel-section">
                <h3>Map Modes</h3>
                <select id="mapMode">
                    <option value="terrain">Terrain</option>
                    <option value="population">Population</option>
                    <option value="political">Political</option>
                    <option value="gdp">GDP</option>
                </select>

                <h3>Drawing Tools</h3>
                <button class="tool-btn" data-terrain="grass">Grass</button>
                <button class="tool-btn" data-terrain="water">Water</button>
                <button class="tool-btn" data-terrain="mountain">Mountain</button>
                <button class="tool-btn" data-terrain="forest">Forest</button>

                <h3>Cities</h3>
                <button class="tool-btn" data-city="small">Small</button>
                <button class="tool-btn" data-city="medium">Medium</button>
                <button class="tool-btn" data-city="large">Large</button>
                <button class="tool-btn" data-city="capital">Capital</button>

                <h3>Countries</h3>
                <input type="text" id="countryName" placeholder="Country name">
                <button id="createCountryBtn">Create Country</button>
                <button id="drawBorderBtn">Draw Border</button>
            </div>

            <div id="gameplayPanel" style="display:none;">
                <div class="panel-section">
                    <h3>Selected Country</h3>
                    <div id="countryInfo">Click a country on map</div>
                </div>

                <div class="panel-section">
                    <h3>War</h3>
                    <button id="declareWarBtn">Declare War</button>
                    <button id="makePeaceBtn">Make Peace</button>
                </div>

                <div class="panel-section">
                    <h3>Spawn Army</h3>
                    <select id="armyType">
                        <option value="infantry">Infantry</option>
                        <option value="tank">Tank</option>
                        <option value="navy">Navy</option>
                        <option value="air">Air</option>
                    </select>
                    <input type="number" id="armyNumber" value="5000" min="1000" step="1000">
                    <button id="spawnArmyBtn">Spawn Army</button>
                </div>
            </div>
        </div>

        <div class="content">
            <canvas id="gameCanvas"></canvas>
            <div class="info-panel">
                <div id="mouseInfo">Hover over map</div>
                <div id="tileInfo">Tile info: --</div>
            </div>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <h2 id="modalTitle"></h2>
            <p id="modalContent"></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const TILE_SIZE = 20;
        let ROWS = Math.floor(canvas.height / TILE_SIZE);
        let COLS = Math.floor(canvas.width / TILE_SIZE);

        let gameState = {
            tiles: [],
            cities: [],
            countries: [],
            armies: [],
            wars: [],
            mapMode: 'terrain',
            currentTool: 'grass',
            selectedCountry: null,
            currentMode: 'map'
        };

        class Tile {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.terrain = 'grass';
                this.owner = null;
            }
            getColor() {
                if (gameState.mapMode === 'political') {
                    return this.owner ? this.owner.color : '#2d5016';
                }
                const colors = { grass: '#2d5016', water: '#1e90ff', mountain: '#696969', forest: '#1b4d2e' };
                return colors[this.terrain] || '#2d5016';
            }
        }

        class City {
            constructor(x, y, type, country) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.country = country;
            }
            draw(ctx) {
                const sx = this.x * TILE_SIZE + TILE_SIZE / 2;
                const sy = this.y * TILE_SIZE + TILE_SIZE / 2;
                ctx.fillStyle = '#ffff00';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                if (this.type === 'capital') {
                    ctx.beginPath();
                    ctx.arc(sx, sy, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    const radii = { large: 5, medium: 4, small: 3 };
                    ctx.beginPath();
                    ctx.arc(sx, sy, radii[this.type] || 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }

        class Country {
            constructor(name, color) {
                this.name = name;
                this.color = color;
                this.cities = [];
                this.territories = [];
                this.enemies = [];
                this.armies = [];
            }
        }

        class Army {
            constructor(x, y, type, country, number) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.country = country;
                this.number = number;
                this.targetX = x;
                this.targetY = y;
            }
            draw(ctx) {
                const sx = this.x * TILE_SIZE + TILE_SIZE / 2;
                const sy = this.y * TILE_SIZE + TILE_SIZE / 2;
                ctx.fillStyle = this.country.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                const radii = { tank: 8, infantry: 6, navy: 5, air: 4 };
                ctx.beginPath();
                ctx.arc(sx, sy, radii[this.type] || 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = '8px Arial';
                ctx.textAlign = 'center';
                ctx.fillText((this.number / 1000).toFixed(0) + 'k', sx, sy);
            }
        }

        function initGame() {
            gameState.tiles = [];
            for (let y = 0; y < ROWS; y++) {
                gameState.tiles[y] = [];
                for (let x = 0; x < COLS; x++) {
                    gameState.tiles[y][x] = new Tile(x, y);
                }
            }

            const c1 = new Country('Red Kingdom', '#ff4444');
            const c2 = new Country('Blue Empire', '#4444ff');
            gameState.countries.push(c1, c2);

            const x1 = Math.floor(COLS * 0.2);
            const y1 = Math.floor(ROWS * 0.5);
            const x2 = Math.floor(COLS * 0.8);
            const y2 = Math.floor(ROWS * 0.5);

            gameState.cities.push(new City(x1, y1, 'capital', c1));
            gameState.cities.push(new City(x2, y2, 'capital', c2));

            gameState.selectedCountry = c1;
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameState.currentMode = e.target.dataset.mode;

                const mapPanel = document.getElementById('mapEditorPanel');
                const gamePanel = document.getElementById('gameplayPanel');
                if (gameState.currentMode === 'map') {
                    mapPanel.style.display = 'block';
                    gamePanel.style.display = 'none';
                } else {
                    mapPanel.style.display = 'none';
                    gamePanel.style.display = 'block';
                }
            });
        });

        document.querySelectorAll('[data-terrain]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                gameState.currentTool = e.target.dataset.terrain;
            });
        });

        document.querySelectorAll('[data-city]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                gameState.currentTool = 'city:' + e.target.dataset.city;
            });
        });

        document.getElementById('createCountryBtn').addEventListener('click', () => {
            const name = document.getElementById('countryName').value || 'Country ' + (gameState.countries.length + 1);
            const color = 'hsl(' + Math.random() * 360 + ', 70%, 50%)';
            gameState.countries.push(new Country(name, color));
            gameState.selectedCountry = gameState.countries[gameState.countries.length - 1];
            document.getElementById('countryName').value = '';
        });

        document.getElementById('drawBorderBtn').addEventListener('click', () => {
            gameState.currentTool = 'border';
        });

        document.getElementById('mapMode').addEventListener('change', (e) => {
            gameState.mapMode = e.target.value;
        });

        document.getElementById('spawnArmyBtn').addEventListener('click', () => {
            if (gameState.selectedCountry && gameState.selectedCountry.cities.length > 0) {
                const city = gameState.selectedCountry.cities[0];
                const type = document.getElementById('armyType').value;
                const number = parseInt(document.getElementById('armyNumber').value);
                gameState.armies.push(new Army(city.x, city.y, type, gameState.selectedCountry, number));
                alert('Army spawned!');
            }
        });

        document.getElementById('declareWarBtn').addEventListener('click', () => {
            const enemies = gameState.countries.filter(c => c !== gameState.selectedCountry);
            if (enemies.length > 0) {
                gameState.selectedCountry.enemies.push(enemies[0]);
                gameState.wars.push({ a: gameState.selectedCountry, b: enemies[0] });
                alert('War declared on ' + enemies[0].name);
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;

            if (gameState.currentMode === 'map') {
                if (gameState.currentTool.startsWith('city:')) {
                    const type = gameState.currentTool.split(':')[1];
                    gameState.cities.push(new City(x, y, type, gameState.selectedCountry));
                } else if (gameState.currentTool === 'border' && gameState.selectedCountry) {
                    gameState.tiles[y][x].owner = gameState.selectedCountry;
                } else {
                    gameState.tiles[y][x].terrain = gameState.currentTool;
                }
            } else {
                if (gameState.tiles[y][x].owner) {
                    gameState.selectedCountry = gameState.tiles[y][x].owner;
                    document.getElementById('countryInfo').innerHTML = '<strong>' + gameState.selectedCountry.name + '</strong>';
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            document.getElementById('mouseInfo').textContent = 'X: ' + x + ', Y: ' + y;
        });

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    ctx.fillStyle = gameState.tiles[y][x].getColor();
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }

            gameState.cities.forEach(c => c.draw(ctx));
            gameState.armies.forEach(a => a.draw(ctx));

            requestAnimationFrame(draw);
        }

        initGame();
        draw();
    </script>
</body>
</html>
