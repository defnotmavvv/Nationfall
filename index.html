<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationfall - War Strategy Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Nationfall</h1>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="map">Map Editor</button>
                    <button class="mode-btn" data-mode="gameplay">Gameplay</button>
                </div>
            </div>

            <!-- MAP EDITOR PANEL -->
            <div id="mapEditorPanel" class="panel active">
                <div class="panel-section">
                    <h3>Map Modes</h3>
                    <select id="mapMode">
                        <option value="terrain">Natural Terrain</option>
                        <option value="population">Population Density</option>
                        <option value="political">Political Map</option>
                        <option value="gdp">GDP Map</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h3>Drawing Tools</h3>
                    <div class="tool-group">
                        <button class="tool-btn" data-tool="terrain" data-value="grass">Grass</button>
                        <button class="tool-btn" data-tool="terrain" data-value="water">Water</button>
                        <button class="tool-btn" data-tool="terrain" data-value="mountain">Mountain</button>
                        <button class="tool-btn" data-tool="terrain" data-value="forest">Forest</button>
                    </div>
                    <div class="tool-group">
                        <label>Brush Size: <input type="range" id="brushSize" min="5" max="50" value="15"></label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Cities & Capitals</h3>
                    <div class="tool-group">
                        <button class="tool-btn" data-tool="city" data-value="small">Small City</button>
                        <button class="tool-btn" data-tool="city" data-value="medium">Medium City</button>
                        <button class="tool-btn" data-tool="city" data-value="large">Large City</button>
                        <button class="tool-btn" data-tool="city" data-value="capital">Capital</button>
                    </div>
                    <div class="tool-group">
                        <label>Population: <input type="number" id="populationInput" value="10000"></label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Borders & Countries</h3>
                    <div class="tool-group">
                        <button class="tool-btn" data-tool="border">Draw Border</button>
                        <button class="tool-btn" data-tool="eraser">Eraser</button>
                    </div>
                    <div class="tool-group">
                        <label>Country Name: <input type="text" id="countryName" placeholder="Country name"></label>
                        <button id="createCountryBtn">Create Country</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Flags</h3>
                    <div class="tool-group">
                        <input type="text" id="flagName" placeholder="Flag name/colors">
                        <button id="generateFlagBtn">Generate Flag</button>
                        <label>Upload Flag: <input type="file" id="flagUpload" accept="image/*"></label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Game Mode</h3>
                    <select id="gameMode">
                        <option value="creative">Creative Mode</option>
                        <option value="simulation">Simulation Mode</option>
                    </select>
                </div>

                <div class="panel-section">
                    <button id="saveMapBtn">Save Map</button>
                    <button id="loadMapBtn">Load Map</button>
                    <button id="clearMapBtn">Clear All</button>
                </div>
            </div>

            <!-- GAMEPLAY PANEL -->
            <div id="gameplayPanel" class="panel">
                <div class="panel-section">
                    <h3>Selected Country</h3>
                    <div id="selectedCountryInfo">
                        <p>Click a country on the map</p>
                    </div>
                </div>

                <div class="panel-section" id="countryActionsSection" style="display:none;">
                    <h3>Country Actions</h3>
                    <div class="tool-group">
                        <button id="rebellionBtn" class="action-btn">Create Rebellion</button>
                        <button id="addPuppetBtn" class="action-btn">Add Puppet State</button>
                        <button id="releasePuppetBtn" class="action-btn">Release Puppet</button>
                        <button id="addAllyBtn" class="action-btn">Add Ally</button>
                        <button id="makeAllianceBtn" class="action-btn">Make Alliance</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>War Management</h3>
                    <div class="tool-group">
                        <button id="declareWarBtn" class="action-btn">Declare War</button>
                        <button id="callAlliesBtn" class="action-btn">Call Allies</button>
                        <button id="makePeaceBtn" class="action-btn">Make Peace</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Armies</h3>
                    <div class="tool-group">
                        <label>Army Type: 
                            <select id="armyType">
                                <option value="infantry">Infantry</option>
                                <option value="tank">Tank</option>
                                <option value="navy">Navy</option>
                                <option value="air">Air Force</option>
                            </select>
                        </label>
                        <label>Numbers: <input type="number" id="armyNumbers" value="5000"></label>
                        <button id="spawnArmyBtn" class="action-btn">Spawn Army</button>
                    </div>
                </div>

                <div class="panel-section">
                    <div id="gameSpeedControl">
                        <label>Game Speed: 
                            <select id="gameSpeed">
                                <option value="1">1x</option>
                                <option value="2">2x</option>
                                <option value="4">4x</option>
                                <option value="8">8x</option>
                            </select>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <canvas id="gameCanvas"></canvas>
            <div class="info-panel">
                <div id="mouseInfo">Coordinates: --</div>
                <div id="tileInfo">Tile: --</div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="modalOverlay" class="modal-overlay">
        <div id="modal" class="modal">
            <button class="modal-close">&times;</button>
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
